[package]
name = "aitop"
version = "0.1.0"
edition = "2021"
description = "Real-time AI Token & Cost Monitor for Claude Code, Codex, and Antigravity"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
